<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/base.css">
<style>
#stage { background: linear-gradient(180deg, #0D1430 0%, #1A2350 55%, #2A2D5C 100%); }
#room { position: absolute; inset: 0; }
#window { position: absolute; left: 90px; top: 560px; width: 300px; height: 420px; border-radius: 28px; border: 12px solid #2E3566;
  background: linear-gradient(180deg, #0A1030, #1B2660); overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,.5); }
#window::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px; background: #2E3566; }
#window::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 10px; margin-top: -5px; background: #2E3566; }
#lamp { position: absolute; left: 640px; top: 900px; width: 900px; height: 900px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,190,110,.55) 0%, rgba(255,170,90,.18) 40%, rgba(255,170,90,0) 70%); }
#stand { position: absolute; left: -40px; right: -40px; top: 1760px; height: 300px; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, #5A3B28, #3E281B); }
.star { position: absolute; left: 0; top: 0; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
#lock { background: linear-gradient(180deg, #121A3E 0%, #22306A 60%, #2D3C80 100%); }
#lockTime { position: absolute; left: 0; right: 0; top: 190px; text-align: center; color: #fff; font-size: 190px; font-weight: 300; letter-spacing: -6px; font-variant-numeric: tabular-nums; }
#lockDate { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: rgba(255,255,255,.8); font-size: 34px; }
.notif.lockn { top: 520px; background: rgba(255,255,255,.94); }
#dim { position: absolute; inset: 0; background: #050817; opacity: 0; }
</style></head>
<body><div id="stage">
  <div id="room">
    <div id="window"><div id="wstars"></div><div class="abs" style="left:170px;top:40px;width:80px;height:80px;border-radius:50%;background:#FFF5D6;box-shadow:0 0 40px rgba(255,240,200,.8)"></div></div>
    <div id="lamp"></div>
    <div id="stand"></div>
  </div>

  <div class="phoneWrap" id="pw"><div class="phone"><div class="screenClip"><div class="island"></div><div class="screen">
    <div id="lock" class="layer">
      <div id="lockDate">Thursday, 23 October</div>
      <div id="lockTime">19:59</div>
      <div class="abs" style="left:0;right:0;top:1460px;display:flex;justify-content:center;gap:200px;opacity:.7">
        <div style="width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15)"></div><div style="width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15)"></div></div>
    </div>
    <div class="notif lockn" id="nt"><div class="hd"><img src="../shared/icon.png"><span>SKYDE</span><span class="now">20:00</span></div>
      <div class="tt">Good evening 🌙</div><div class="bd">Tomorrow: dry and sunny, up to 24°. A light jacket for the morning.</div></div>
  </div></div></div></div>
  <div id="dim"></div>
  <div id="cap1" class="cap"></div><div id="cap2" class="cap"></div><div id="cap3" class="cap"></div><div id="cap4" class="cap"></div>
  <div id="endHost"></div>
</div>
<script src="../shared/icons.js"></script><script src="../shared/base.js"></script>
<script>
seedRnd(71);
$('endHost').outerHTML = END_HTML('Tomorrow, in <b>one sentence.</b>', 'Turn on your evening summary 🌙');
initIcons();
const wst = Array.from({ length: 18 }, () => {
  const s = document.createElement('div'); s.className = 'star'; $('wstars').appendChild(s);
  return { el: s, x: rnd() * 280, y: rnd() * 400, ph: rnd() * 6.28 };
});
Caps.add('cap1', ['It’s almost', '*8 p.m.*'], null, .2, 2.8);
Caps.add('cap2', ['Tomorrow’s weather,', 'in *one sentence.*'], 'No charts. No radar.', 3.4, 8.6);
Caps.add('cap3', ['Every night', 'at *8 p.m.*'], 'Skyde’s evening summary.', 9.0, 12.4);
Caps.add('cap4', ['Sleep', '*well.*'], null, 12.8, 14.6);
const FLIP = 2.8, NOTIF = 3.1, LAMP_OFF = 12.6, END = 15.0;
// the phone sits a little lower, like it's resting on the nightstand stand
$('pw').style.top = '640px';

window.render = t => {
  wst.forEach(s => { s.el.style.opacity = .3 + .7 * Math.max(0, Math.sin(t * 2 + s.ph)); s.el.style.transform = `translate(${s.x}px, ${s.y}px)`; });
  const lampOff = eIO(P01(t, LAMP_OFF, LAMP_OFF + .6));
  $('lamp').style.opacity = (.85 + .15 * Math.sin(t * 1.4)) * (1 - lampOff);
  $('dim').style.opacity = lampOff * .45 * (1 - P01(t, END, END + .8));
  $('room').style.opacity = 1 - P01(t, END - .3, END + .4) * .6;
  Caps.update(t);

  phoneUpdate($('pw'), t, { enter: [0, .9], exit: [14.2, 14.9], zoom: [3.6, 4.4, 1.12], vib: [NOTIF] });
  $('lockTime').textContent = t < FLIP ? '19:59' : '20:00';
  $('lockTime').style.transform = `scale(${1 + .06 * pulseAt(t, FLIP + .05, .2)})`;
  notifUpdate($('nt'), t, NOTIF, 14.2, 5.0);
  endUpdate(t, END);
};
render(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script><script id="warp">applyWarp([[0.0, 0.0], [3.4, 3.4], [8.9, 8.9], [12.87, 12.7], [15.27, 15.1], [19.18, 19.0]]);</script>
</body></html>
