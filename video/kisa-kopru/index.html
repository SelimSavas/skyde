<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kısa · Sekiz yüz yıllık köprünün sırrı</title>
  <link rel="stylesheet" href="../shared/player.css">
</head>
<body>
  <main class="stage">
    <canvas id="film" aria-label="Animasyon: Kısa · Sekiz yüz yıllık köprünün sırrı"></canvas>
    <button class="big-play" id="bigPlay" aria-label="Oynat">▶</button>
    <div class="status" id="status">Ses sentezleniyor…</div>
  </main>
  <div class="controls">
    <button id="play" aria-label="Oynat">▶</button>
    <span id="time">0:00 / 0:23</span>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Zaman">
    <span id="scene"></span>
    <button id="fs" aria-label="Tam ekran">⛶</button>
  </div>
  <script src="../shared/engine.js"></script>
  <script src="../shared/synth.js"></script>
  <!-- Görüntüler Önsöz filminden yeniden çizilir -->
  <script src="../onsoz/narration.js"></script>
  <script src="../onsoz/voice.js"></script>
  <script src="../onsoz/film.js"></script>
  <script>window.ONSOZ = window.FILM; delete window.FILM; delete window.VOICE; delete window.NARRATION;</script>
  <script src="../kisa/kisa.js"></script>
  <script src="narration.js"></script>
  <script src="voice.js"></script>
  <script src="film.js"></script>
  <script src="../shared/player.js"></script>
</body>
</html>
