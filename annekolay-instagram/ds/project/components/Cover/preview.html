<!-- @dsCard height=288 -->
<div class="cover">
  <svg class="art" viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- blocks: adacayi-acik 250×176, kiremit 220×184, seftali 150×136 (bleeds top-right), gece 128×96, adacayi tape 128×26; radius `etiket` 4px
         arrangement: staggered stack of pasted papers, each tilted 2-8°, all right of x=480, seftali bleeding off the top/right edge
         pattern: notebook ruling (README: "Anne Defteri", every post is a notebook page) -> 3 hairline rules in `adacayi` at the `not-satiri` 71px pitch crossing the blocks
         steps: rules at y 78/149/220 (71px), block offsets in 24px (multiples of 8); radius `etiket` -->
    <rect class="b-seftali r" x="824" y="-24" width="160" height="160" transform="rotate(5 904 56)"/>
    <rect class="b-acik r" x="512" y="32" width="250" height="176" transform="rotate(-3 637 120)"/>
    <rect class="b-kiremit r" x="712" y="72" width="220" height="184" transform="rotate(4 822 164)"/>
    <rect class="b-gece r" x="568" y="168" width="128" height="96" transform="rotate(2 632 216)"/>
    <rect class="b-adacayi r" x="616" y="16" width="128" height="26" transform="rotate(-8 680 29)"/>
    <g class="rules"><line x1="480" y1="78" x2="960" y2="78"/><line x1="480" y1="149" x2="960" y2="149"/><line x1="480" y1="220" x2="960" y2="220"/></g>
  </svg>
  <div class="txt"><div class="name">AnneKolay<br>Instagram</div><div class="tag">Anne Defteri: hamilelikten ilk yaşa, birlikte.</div></div>
</div>
<style>
.cover { position: relative; width: 960px; height: 288px; background: var(--keten); overflow: hidden; }
.art { position: absolute; inset: 0; width: 960px; height: 288px; }
.rules line { stroke: var(--adacayi); stroke-width: 1.5; }
.r { rx: var(--etiket, 4px); }
.b-seftali { fill: var(--seftali); } .b-acik { fill: var(--adacayi-acik); } .b-kiremit { fill: var(--kiremit); }
.b-gece { fill: var(--gece); } .b-adacayi { fill: var(--adacayi); }
.txt { position: absolute; left: 40px; bottom: 30px; width: 440px; }
.name { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 88px; line-height: .95; color: var(--toprak); letter-spacing: -1px; }
.tag { margin-top: 14px; font-family: Poppins, Arial, sans-serif; font-size: 14px; color: var(--toprak); }
</style>
