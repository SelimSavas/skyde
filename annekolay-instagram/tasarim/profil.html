<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body{padding:0;background:#fff}
.phone{width:1080px;background:#fff;color:#1a1a1a;font-family:var(--f-body);padding:40px 0 0}
.top{display:flex;align-items:center;gap:56px;padding:0 48px}
.av{width:220px;height:220px;border-radius:50%;background:var(--krem) url(emblem.png) center/78% no-repeat;border:3px solid #e8e2d8;flex:none}
.stats{display:flex;gap:70px;font-size:30px;text-align:center}.stats b{display:block;font-size:40px}

</style></head><body>
